services:
  db:
    image: pgvector/pgvector:pg16
    container_name: astrology_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-astrology_prod}
      POSTGRES_USER: ${POSTGRES_USER:-astrology_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astrology_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-astrology_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-astrology_prod}
      DATABASE_SYNC_URL: postgresql+psycopg://${POSTGRES_USER:-astrology_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-astrology_prod}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Scheduler defaults to in-process disabled for multi-worker container safety
      ENABLE_BACKGROUND_SCHEDULER: ${ENABLE_BACKGROUND_SCHEDULER:-false}
    ports:
      # Bound strictly to loopback interface on host (never exposed directly to public internet)
      - "127.0.0.1:8000:8000"
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres_data:
    name: astrology_postgres_data

networks:
  internal_net:
    name: astrology_internal_net
    driver: bridge
